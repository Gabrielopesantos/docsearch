[project]
name = "docsearch"
version = "0.1.0"
description = "Semantic search over local documents using embeddings (PDF support)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "libsql>=0.1.11",
  "pymupdf>=1.24.0",
  "sentence-transformers>=3.0.0",
]

[project.scripts]
docsearch = "docsearch.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docsearch"]
