[project]
name = "docsearch"
version = "0.1.0"
description = "Semantic search over local documents using embeddings (PDF support)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libsql>=0.1.11",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[project.scripts]
docsearch = "docsearch.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docsearch"]

# ==============================================================================
# Ruff configuration
# ==============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable common rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize Python code)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "PL",   # Pylint
    "PERF", # Performance anti-patterns
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLR0912", # Too many branches
    "PLW0603", # Using global statement (acceptable for color caching)
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py
"__init__.py" = ["F401"]
# Allow lazy imports in CLI for better startup performance
"cli.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
